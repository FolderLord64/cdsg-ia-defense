<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!--
      /cdsg-ia-defense/ est remplacé automatiquement par Vite avec la
      valeur de "base" définie dans vite.config.js (utile pour un
      déploiement dans un sous-dossier, comme GitHub Pages).
    -->
    <link rel="icon" type="image/svg+xml" href="/cdsg-ia-defense/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Titre et description : à adapter si besoin (nom de la classe,
      établissement, année...). C'est ce qui s'affiche dans l'onglet
      du navigateur et dans les résultats de recherche/partages.
    -->
    <title>IA & Défense — Classe Défense CDSG</title>
    <meta
      name="description"
      content="L'intelligence artificielle dans les domaines civil et militaire : IA descriptive, prédictive, prescriptive, générative, fonctionnement, risques et dérives."
    />

    <!--
      POLICES (Google Fonts)
      ----------------------
      - Space Grotesk  : police des TITRES (géométrique, technique)
      - Inter          : police de repli pour le CORPS DE TEXTE.
                         Sur Mac/iPhone/iPad, le CSS (voir global.css)
                         utilise en priorité la police système
                         "SF Pro Display" (-apple-system), qui n'a pas
                         besoin d'être chargée ici : elle est déjà
                         installée sur ces appareils. Inter ne sert
                         donc que pour les autres systèmes (Windows,
                         Android, Linux) et ressemble visuellement à
                         SF Pro Display.
      - JetBrains Mono : police "utilitaire" pour les petits labels
                         techniques (ex. sigles GAN, LAWS, ROEM dans
                         le glossaire), effet "écran de contrôle".

      Pour changer une police : remplace le nom ci-dessous ET la
      variable correspondante dans src/styles/global.css
      (--font-display / --font-body / --font-mono).
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script type="module" crossorigin src="/cdsg-ia-defense/assets/index-Cm13Y14i.js"></script>
    <link rel="stylesheet" crossorigin href="/cdsg-ia-defense/assets/index-BoLAv9HT.css">
  </head>

  </body>
</html>
