<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!--
    CURSEUR "ACTIF" — réticule verrouillé sur une cible
    Affiché au survol de tout élément cliquable (liens, boutons,
    cartes...) : le cercle se remplit légèrement et les coins se
    resserrent, comme un viseur qui vient de "verrouiller" sa
    cible. Même logique de halo blanc que le curseur par défaut,
    pour rester visible sur tous les fonds. Hotspot au centre
    (16,16), comme le curseur par défaut.
  -->

  <!-- Halo de contraste -->
  <g stroke="white" stroke-opacity="0.85" stroke-width="3" stroke-linecap="round">
    <path d="M9 9 L9 5 M9 9 L5 9" />
    <path d="M23 9 L23 5 M23 9 L27 9" />
    <path d="M9 23 L9 27 M9 23 L5 23" />
    <path d="M23 23 L23 27 M23 23 L27 23" />
  </g>

  <!-- Coins de visée (façon cadre de ciblage HUD) -->
  <g stroke="#5b9bc4" stroke-width="1.8" stroke-linecap="round">
    <path d="M9 9 L9 5 M9 9 L5 9" />
    <path d="M23 9 L23 5 M23 9 L27 9" />
    <path d="M9 23 L9 27 M9 23 L5 23" />
    <path d="M23 23 L23 27 M23 23 L27 23" />
  </g>

  <!-- Cible verrouillée au centre (cercle plein léger + anneau) -->
  <circle cx="16" cy="16" r="5" fill="#5b9bc4" fill-opacity="0.25" stroke="white" stroke-opacity="0.85" stroke-width="2.6" />
  <circle cx="16" cy="16" r="5" fill="none" stroke="#5b9bc4" stroke-width="1.4" />
  <circle cx="16" cy="16" r="1.4" fill="#5b9bc4" />
</svg>
